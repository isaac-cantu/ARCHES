# ARCHES (Exploration for Shower Reconstruction)

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arches"
version = "0.1.0"
description = "Pipeline for cosmic ray shower reconstruction using ML and physics-based methods"
authors = [
    { name = "Isaac Cantú" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "torch",
    "torchvision",
    "torchaudio",
    "pyyaml",
    "ipykernel",
    "mlflow"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black"
]
# Enables search.run_search's strategy: optuna (Bayesian/TPE hyperparameter
# search with early pruning) as an alternative to grid/random -- see
# docs/SEARCH.md#optuna.
optuna = [
    "optuna>=3.0"
]
# Enables data.load_db.DAT_file() to read raw CORSIKA .DAT files directly
# (fast C++/pybind11 reader), instead of requiring a pre-converted CSV.
# See https://github.com/isaac-cantu/corsario
corsario = [
    "corsario @ git+https://github.com/isaac-cantu/corsario.git"
]

[project.urls]
Repository = "https://github.com/isaac-cantu/ARCHES"

