experiment:
  id: 1
  name: "prueba"
  description: "Experimento para reconstrucción de energía y ángulo"
  path: "/home/icantu24/Documents/ARCHES/experiments"

data:
  path: "/home/icantu24/Documents/ARCHES/data/processed/example"
  input_type: "circle"
  output: ["energy"]

model:
  type: mlp
  dropout: false
  batchnorm: false

training:
  epochs: 50
  batch_size: [32]
  optimizer:
    type: adam
    lr: 1e-3

  early_stopping:
    enabled: true
    patience: 10

  split:
    train: .70
    validation: .15
    test: .15

search_space:
  layers: [2] #hidden layers
  neurons: [32,64]
  seed: [42]
  activation: ["relu"]

loss:
  type: "mse"

metrics:
  - energy_res
  - mse
  - R2