experiment:
  id: 1
  name: "mlp_energy_reconstruction"
  description: "Experimento para reconstrucción de energía y ángulo"

data:
  path: "/home/icantu24/Documents/ARCHES/data/processed/example"
  input_type: "grid"
  output: ["energy"]

model:
  type: mlp
  dropout: [false,0.5]
  batchnorm: false

training:
  epochs: 50
  batch_size: [32]
  optimizer:
    type: adam
    lr: [1e-3]

  early_stopping:
    enabled: true
    patience: 10

  split:
    train: 70
    validation: 15
    test: 15

search_space:
  layers: [3,4,5,6,7,8,9,10] #hidden layers
  neurons: [32,64,128,256]
  seed: [42,100,52]
  activation: ["relu"]

loss:
  type: "mse"

metrics:
  - energy_res
  - mse
  - R2